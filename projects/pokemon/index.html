<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />

    <meta description="Pokemon" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      rel="stylesheet"
      href="https://necolas.github.io/normalize.css/latest/normalize.css"
    />
    <link rel="stylesheet" href="../../../styles/reset.css" />
    <link rel="stylesheet" href="./style.css" />

    <script src="./index.js" defer></script>

    <title>Pokemon</title>
  </head>

  <body>
    <h1>
      <img src="https://www.vodafone.co.uk/newscentre/app/uploads/2023/02/Pokemon_logo.png" alt="Pokemon logo" />
    </h1>

    <form id="pokemon-filter-form">
      <label for="page">Page:</label>
      <input type="number" id="page" name="page" value="1" min="1" required>

      <label for="lang">Langue:</label>
      <input type="text" id="lang" name="lang" value="fr" required>

      <button type="submit">Filtrer</button>
    </form>

    <div class="pokemon" id="pokemon-container"></div>
  </body>
</html>
